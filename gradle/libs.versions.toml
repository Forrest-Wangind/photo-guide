[versions]
# --- 版本锁定说明 ---------------------------------------------------------
# 这些版本不是"随手挑最新的"，而是用 Gradle Module Metadata 反查过
# 各自依赖的 kotlin-stdlib 版本后定下来的（见 docs/04-Phase1实施记录.md）：
#   ktor 3.5.2            -> kotlin-stdlib 2.3.21
#   compose-runtime 1.11.1-> kotlin-stdlib 2.2.20
#   serialization 1.10.0  -> kotlin-stdlib 2.3.0
#   coroutines 1.11.0     -> kotlin-stdlib 2.2.20
# 取上界 Kotlin 2.3.21，保证不会有"用更新 Kotlin 编译"的元数据冲突。
# AGP 8.11.1：由 Android Studio 版本上限决定，不是随便挑的。
#   AS 2025.1.1 (Narwhal) 官方兼容范围 = AGP 3.2~8.11，超出会直接拒绝 Sync。
#   8.12 需 AS 2025.1.2，8.13 需 AS 2025.1.3+（见 developer.android.com/build/releases/about-agp）。
#   取 8.11.1 而非已发布的 8.11.2：AS 的版本检查按 8.11.1 这个上界判定。
#   升级 AS 到 2025.1.3+ 后可放开到 8.13，属独立动作。
# Gradle 8.13（wrapper 当前值）满足 AGP 8.11 的最低要求（>= 8.13）。
# compileSdk 36 已安装（platforms/android-36），AGP 8.9.1+ 均支持 API 36。
# -------------------------------------------------------------------------
kotlin = "2.3.21"
agp = "8.11.1"
composeMultiplatform = "1.11.1"

androidCompileSdk = "36"
androidMinSdk = "26"
androidTargetSdk = "36"

activityCompose = "1.12.4"
coreKtx = "1.17.0"
androidxLifecycle = "2.9.4"
camerax = "1.5.3"

ktor = "3.5.2"
coroutines = "1.11.0"
serialization = "1.10.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

androidx-camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
